# ============================================================
# Ubuntu Keyboard Layer - keybindings.conf
# ============================================================
#
# This file is the ONLY thing you need to edit.
# After changing it, run:  ./apply.sh
#
# FORMAT
#   KEYS = ACTION
#
# KEYS
#   Modifiers: SUPER  CTRL  ALT  SHIFT   (joined with +)
#   Keys:      A-Z  0-9  F1-F12  ENTER  SPACE  TAB  ESC
#              UP  DOWN  LEFT  RIGHT  PAGEUP  PAGEDOWN
#   Examples:  SUPER+E    SUPER+SHIFT+S    CTRL+ALT+T
#
# ACTIONS (the full vocabulary)
#   Launch       terminal  files  browser  overview  apps
#                exec:<any command>        e.g. exec:gnome-calculator
#   Windows      close  minimize  maximize  toggle-maximized
#                toggle-fullscreen  tile:left  tile:right
#   Monitors     move-to-monitor:left|right|up|down
#   Workspaces   workspace:1..9  workspace:last
#                move-to-workspace:1..9  move-to-workspace:last
#   System       lock  screenshot  notifications
#   Advanced     gsettings:<schema> <key>   (any GNOME shortcut key)
#
# RULES
#   - Lines starting with # are comments. Do not put # inside a command.
#   - Do not use quotes in exec: commands.
#   - One action per key. Duplicate keys are an error.
#   - To disable a binding, delete the line or comment it out.
#
# MODE
#   additive  = keep GNOME's own shortcuts for the same actions
#               (Alt+F4 still closes a window) and add yours.
#               RECOMMENDED.
#   takeover  = replace them: only the keys in this file are used
#               for these actions.
#
#   In both modes, if one of your keys is already used by a
#   DIFFERENT GNOME action (e.g. the dock's Super+1), that default
#   is removed so your key works. Everything is backed up and
#   "Remove" in keyboard.sh restores it.
#
# Workspaces are dynamic: Super+5 does nothing until workspace 5
# exists. Fill workspaces in order and GNOME creates the next one.
# ============================================================

@mode = additive


# ------------------------------------------------------------
# Launch
# ------------------------------------------------------------

SUPER+ENTER = terminal
SUPER+E     = files
SUPER+B     = browser

# Search / app launcher. Pressing Super alone usually does this
# already; this gives you an explicit chord as well.
# NOTE: Ubuntu uses Super+Space to switch keyboard layouts.
# If you type in more than one layout, change this to something
# else (Super+S already opens the overview by default).
SUPER+SPACE = overview

# SUPER+A   = apps            # full application grid


# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

SUPER+W       = close
SUPER+F       = toggle-maximized
SUPER+SHIFT+F = toggle-fullscreen
SUPER+N       = minimize

# Half-screen tiling (these are GNOME defaults, listed so the
# layer is complete and survives takeover mode).
SUPER+LEFT    = tile:left
SUPER+RIGHT   = tile:right


# ------------------------------------------------------------
# Monitors (multi-monitor setups)
# ------------------------------------------------------------

SUPER+SHIFT+LEFT  = move-to-monitor:left
SUPER+SHIFT+RIGHT = move-to-monitor:right
SUPER+SHIFT+UP    = move-to-monitor:up
SUPER+SHIFT+DOWN  = move-to-monitor:down


# ------------------------------------------------------------
# Workspaces: switch
# ------------------------------------------------------------

SUPER+1 = workspace:1
SUPER+2 = workspace:2
SUPER+3 = workspace:3
SUPER+4 = workspace:4
SUPER+5 = workspace:5
SUPER+6 = workspace:6
SUPER+7 = workspace:7
SUPER+8 = workspace:8
SUPER+9 = workspace:9
SUPER+0 = workspace:last


# ------------------------------------------------------------
# Workspaces: send the focused window
# ------------------------------------------------------------

SUPER+SHIFT+1 = move-to-workspace:1
SUPER+SHIFT+2 = move-to-workspace:2
SUPER+SHIFT+3 = move-to-workspace:3
SUPER+SHIFT+4 = move-to-workspace:4
SUPER+SHIFT+5 = move-to-workspace:5
SUPER+SHIFT+6 = move-to-workspace:6
SUPER+SHIFT+7 = move-to-workspace:7
SUPER+SHIFT+8 = move-to-workspace:8
SUPER+SHIFT+9 = move-to-workspace:9
SUPER+SHIFT+0 = move-to-workspace:last


# ------------------------------------------------------------
# System
# ------------------------------------------------------------

SUPER+L       = lock
SUPER+SHIFT+S = screenshot
SUPER+V       = notifications


# ------------------------------------------------------------
# Your own shortcuts
# ------------------------------------------------------------
# Uncomment and edit, or add new lines below.
#
# SUPER+C       = exec:gnome-calculator
# SUPER+T       = exec:gnome-system-monitor
# CTRL+ALT+DEL  = exec:gnome-system-monitor
